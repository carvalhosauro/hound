# Publish container image to GitHub Container Registry (DX D0.5 / D7.2).
#
# Tags:
#   push v1.2.3  → ghcr.io/<owner>/hound:1.2.3 + :v1.2.3 + :latest
#   push main    → ghcr.io/<owner>/hound:main   (:latest is NEVER from main)
#   workflow_dispatch → :sha-<short> (+ :main if on default branch)
#
# Cutting a release: docs/release.md. Binary GitHub Release: release.yml.
#
# After the first successful run, set the package visibility to Public:
#   https://github.com/users/<owner>/packages/container/hound/settings

name: Publish GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # linux/amd64 only: QEMU-emulated arm64 C++ compiles are very slow.
          # For arm64 later, use a native ubuntu-24.04-arm job + manifest merge.
          platforms: linux/amd64
